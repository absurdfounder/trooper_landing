<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trooper dashboard preview</title>
    <script>
      try {
        localStorage.setItem('trooper.lookAndFeel.v1', JSON.stringify({
          appearance: 'dark', colorTheme: 'ink', themeId: 'trooper', teamThemeId: 'pastel', chatStyle: 'bubbles',
        }));
        localStorage.setItem('trooper-sidebar-main-tab', 'chats');
        localStorage.setItem('trooper_tasks_view', 'board');
        document.documentElement.dataset.theme = 'ink';
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } catch {}
      // The app router expects its normal root path. The landing fixture always
      // mounts chat beside the board, keeping the right workspace pane visible.
      try {
        const params = new URLSearchParams(location.search);
        if (!params.has('channel')) params.set('channel', 'general');
        if (!params.has('workspace')) params.set('workspace', 'board');
        history.replaceState(null, '', `/?${params.toString()}`);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
